name: codeql

on:
  workflow_dispatch: {}
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "23 4 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: c-cpp
            build-mode: manual
          - language: actions
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        # Overlay analysis cannot trace a manual C/C++ build.
        env:
          CODEQL_OVERLAY_DATABASE_MODE: none
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Build C/C++ database
        if: matrix.language == 'c-cpp'
        # Build every backend an x86_64 runner can compile so CodeQL sees each
        # preprocessor path: SSE intrinsics, the 4-wide scalar emulation, and
        # the SIMD_SZ == 1 scalar kernels.
        run: |
          set -euxo pipefail
          build() {
            cmake -S . -B "build_$1" -DCMAKE_BUILD_TYPE=Debug \
              -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF \
              -DPFFFT_USE_BENCH_POCKET=OFF "${@:2}"
            cmake --build "build_$1" --parallel
          }
          build simd
          build scalar-vect -DPFFFT_USE_SIMD=OFF
          build scalar -DPFFFT_USE_SIMD=OFF -DPFFFT_USE_SCALAR_VECT=OFF

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
