name: C/C++ CI

on:
  push:
    branches:
      - master
      - github_actions
  pull_request:
    branches:
      - master
      - github_actions

permissions:
  contents: read

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build_release_profiles:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        preset: [release, release-native, release-native-unfused, release-haswell]
    env:
      CC: ${{ matrix.compiler }}
      CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
      PRESET: ${{ matrix.preset }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Configure
      run: cmake --preset "$PRESET" -DPFFFT_BUILD_BENCHMARKS=OFF -DPFFFT_BUILD_EXAMPLES=OFF
    - name: Build
      run: cmake --build --preset "$PRESET" --parallel 2
    - name: Test
      run: ctest --preset "$PRESET" -j 2
    # The pass schedule switches (PFFFT_TERMINAL_RADIX8, PFFFT_INPLACE_FIRST_PASS)
    # default to on here: test the other positions, each in its own build
    # directory with the cache variables of the release preset spelled out
    # (Ninja, Release, TARGET_<lang>_ARCH=none) and its test preset's output
    - name: pass schedule switches off (previous passes)
      if: matrix.preset == 'release'
      run: |
        cmake -S . -B build_passes_off -G Ninja -DCMAKE_BUILD_TYPE=Release -DTARGET_C_ARCH=none -DTARGET_CXX_ARCH=none -DPFFFT_BUILD_BENCHMARKS=OFF -DPFFFT_BUILD_EXAMPLES=OFF -DPFFFT_TERMINAL_RADIX8=OFF -DPFFFT_INPLACE_FIRST_PASS=OFF
        cmake --build build_passes_off --parallel 2
        ctest --test-dir build_passes_off -j 2 --output-on-failure
    - name: pass schedule mixed, terminal radix 8 only
      if: matrix.preset == 'release'
      run: |
        cmake -S . -B build_passes_radix8_only -G Ninja -DCMAKE_BUILD_TYPE=Release -DTARGET_C_ARCH=none -DTARGET_CXX_ARCH=none -DPFFFT_BUILD_BENCHMARKS=OFF -DPFFFT_BUILD_EXAMPLES=OFF -DPFFFT_TERMINAL_RADIX8=ON -DPFFFT_INPLACE_FIRST_PASS=OFF
        cmake --build build_passes_radix8_only --parallel 2
        ctest --test-dir build_passes_radix8_only -j 2 --output-on-failure
    - name: pass schedule mixed, in-place first pass only
      if: matrix.preset == 'release'
      run: |
        cmake -S . -B build_passes_inplace_only -G Ninja -DCMAKE_BUILD_TYPE=Release -DTARGET_C_ARCH=none -DTARGET_CXX_ARCH=none -DPFFFT_BUILD_BENCHMARKS=OFF -DPFFFT_BUILD_EXAMPLES=OFF -DPFFFT_TERMINAL_RADIX8=OFF -DPFFFT_INPLACE_FIRST_PASS=ON
        cmake --build build_passes_inplace_only --parallel 2
        ctest --test-dir build_passes_inplace_only -j 2 --output-on-failure
    - name: pass schedule forced on, single-lane scalar (not the default on this backend)
      # SIMD_SZ == 1 without the fused layout, where the in-place first pass
      # compiles to nothing and the terminal radix-8 pass is off by default
      # (pffft_pass_config.h): test it on; the default position of the
      # single-lane scalar build is tested by the no-simd_novect steps
      if: matrix.preset == 'release'
      run: |
        cmake -S . -B build_passes_scalar_on -G Ninja -DCMAKE_BUILD_TYPE=Release -DTARGET_C_ARCH=none -DTARGET_CXX_ARCH=none -DPFFFT_BUILD_BENCHMARKS=OFF -DPFFFT_BUILD_EXAMPLES=OFF -DPFFFT_USE_SIMD=OFF -DPFFFT_USE_SCALAR_VECT=OFF -DPFFFT_TERMINAL_RADIX8=ON -DPFFFT_INPLACE_FIRST_PASS=ON
        cmake --build build_passes_scalar_on --parallel 2
        ctest --test-dir build_passes_scalar_on -j 2 --output-on-failure

  build_w_mipp_ubuntu-amd64:
    runs-on: ubuntu-latest

    steps:
    - name: check out MIPP
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          repository: hayguen/MIPP
          path: ./MIPP
          persist-credentials: false
    - name: Install MIPP headers
      run: cmake -E copy_directory MIPP/src "$HOME/.local/include/mipp"

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: cmake_make_simd_float_double
      run: mkdir build_simd_full && cmake -S . -B build_simd_full -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DTARGET_CXX_ARCH=x86-64 -DTARGET_C_ARCH=x86-64  && cmake --build build_simd_full && ctest --test-dir build_simd_full --output-on-failure -j 4
    - name: cmake_make_simd_float
      run: mkdir build_simd_float && cmake -S . -B build_simd_float -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_TYPE_DOUBLE=OFF -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DTARGET_CXX_ARCH=x86-64 -DTARGET_C_ARCH=x86-64  && cmake --build build_simd_float && ctest --test-dir build_simd_float --output-on-failure -j 4
    - name: cmake_make_simd_double
      run: mkdir build_simd_double && cmake -S . -B build_simd_double -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_TYPE_FLOAT=OFF -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DTARGET_CXX_ARCH=x86-64 -DTARGET_C_ARCH=x86-64  && cmake --build build_simd_double && ctest --test-dir build_simd_double --output-on-failure -j 4
    - name: cmake_make_no-simd_float_double
      run: mkdir build_no-simd_full && cmake -S . -B build_no-simd_full -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_SIMD=OFF -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DTARGET_CXX_ARCH=x86-64 -DTARGET_C_ARCH=x86-64  && cmake --build build_no-simd_full && ctest --test-dir build_no-simd_full --output-on-failure -j 4
    - name: cmake_make_no-simd_novect_float_double
      run: mkdir build_no-simd_novect && cmake -S . -B build_no-simd_novect -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_SIMD=OFF -DPFFFT_USE_SCALAR_VECT=OFF -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DTARGET_CXX_ARCH=x86-64 -DTARGET_C_ARCH=x86-64 && cmake --build build_no-simd_novect
    - name: ctest_no-simd_novect
      # greenffts octave wrappers cannot run outside their environment;
      # everything else -- including the SIMD_SZ==1 nosimd kernels --
      # must pass. (The harness step-0 loop that used to hang this test
      # under SZ=1 was fixed in tests/test_fft_factors.c.)
      run: cd build_no-simd_novect && ctest -E "convTest|conv2dTest|rfft2d" --output-on-failure

  build_ubuntu-amd64:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: cmake_make_simd_float_double
      run: mkdir build_simd_full && cmake -S . -B build_simd_full -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DTARGET_CXX_ARCH=x86-64 -DTARGET_C_ARCH=x86-64  && cmake --build build_simd_full && ctest --test-dir build_simd_full --output-on-failure -j 4
    - name: cmake_make_simd_float
      run: mkdir build_simd_float && cmake -S . -B build_simd_float -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_TYPE_DOUBLE=OFF -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DTARGET_CXX_ARCH=x86-64 -DTARGET_C_ARCH=x86-64  && cmake --build build_simd_float && ctest --test-dir build_simd_float --output-on-failure -j 4
    - name: cmake_make_simd_double
      run: mkdir build_simd_double && cmake -S . -B build_simd_double -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_TYPE_FLOAT=OFF -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DTARGET_CXX_ARCH=x86-64 -DTARGET_C_ARCH=x86-64  && cmake --build build_simd_double && ctest --test-dir build_simd_double --output-on-failure -j 4
    - name: cmake_make_no-simd_float_double
      run: mkdir build_no-simd_full && cmake -S . -B build_no-simd_full -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_SIMD=OFF -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DTARGET_CXX_ARCH=x86-64 -DTARGET_C_ARCH=x86-64  && cmake --build build_no-simd_full && ctest --test-dir build_no-simd_full --output-on-failure -j 4
    - name: cmake_make_no-simd_novect_float_double
      run: mkdir build_no-simd_novect && cmake -S . -B build_no-simd_novect -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_SIMD=OFF -DPFFFT_USE_SCALAR_VECT=OFF -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DTARGET_CXX_ARCH=x86-64 -DTARGET_C_ARCH=x86-64 && cmake --build build_no-simd_novect
    - name: ctest_no-simd_novect
      # greenffts octave wrappers cannot run outside their environment;
      # everything else -- including the SIMD_SZ==1 nosimd kernels --
      # must pass. (The harness step-0 loop that used to hang this test
      # under SZ=1 was fixed in tests/test_fft_factors.c.)
      run: cd build_no-simd_novect && ctest -E "convTest|conv2dTest|rfft2d" --output-on-failure

  build_ubuntu-arm64:
    # native AArch64 with gcc: NEON float and double, and the sse2neon mixer
    runs-on: ubuntu-26.04-arm

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: cmake_make_simd_float_double
      run: cmake -S . -B build_simd_full -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF && cmake --build build_simd_full --parallel && ctest --test-dir build_simd_full --output-on-failure -j 4
    - name: cmake_make_simd_debug
      # asserts enabled: buffer alignment checks and the SIMD macro validation
      run: cmake -S . -B build_simd_debug -DCMAKE_BUILD_TYPE=Debug -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF && cmake --build build_simd_debug --parallel && ctest --test-dir build_simd_debug --output-on-failure -j 4
    - name: cmake_make_no-simd_float_double
      run: cmake -S . -B build_no-simd_full -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_SIMD=OFF -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF && cmake --build build_no-simd_full --parallel && ctest --test-dir build_no-simd_full --output-on-failure -j 4
    - name: pass schedule switches off (the previous passes)
      # the pass schedule switches default to on; the other position
      run: cmake -S . -B build_simd_passes_off -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DPFFFT_TERMINAL_RADIX8=OFF -DPFFFT_INPLACE_FIRST_PASS=OFF && cmake --build build_simd_passes_off --parallel && ctest --test-dir build_simd_passes_off --output-on-failure -j 4

  build_linux_cross_qemu:
    name: build_linux_cross_qemu (armv7-neon)
    runs-on: ubuntu-latest
    env:
      TRIPLE: arm-linux-gnueabihf
      FLAGS: -march=armv7-a -mfpu=neon-vfpv4 -mfloat-abi=hard

    steps:
    - name: prerequisites
      run: |
        sudo apt-get -qq update
        sudo apt-get -yqq install qemu-user "g++-$TRIPLE"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: configure
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
          -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=armv7l \
          -DCMAKE_C_COMPILER="$TRIPLE-gcc" -DCMAKE_CXX_COMPILER="$TRIPLE-g++" \
          -DCMAKE_C_FLAGS="$FLAGS" -DCMAKE_CXX_FLAGS="$FLAGS" \
          -DMATH_LIBRARY="/usr/$TRIPLE/lib/libm.so" \
          "-DCMAKE_CROSSCOMPILING_EMULATOR=qemu-arm;-L;/usr/$TRIPLE" \
          -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DPFFFT_BUILD_EXAMPLES=OFF \
          > configure.log
        cat configure.log
        grep -F "Detected SIMD backend for PFFFT: float: NEON, double: 4xScalar" configure.log
    - name: build
      run: cmake --build build --parallel
    - name: test
      run: ctest --test-dir build --output-on-failure -j 4
    - name: pass schedule switches off (the previous passes)
      # the pass schedule switches default to on; the other position
      run: |
        cmake -S . -B build_passes_off -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
          -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=armv7l \
          -DCMAKE_C_COMPILER="$TRIPLE-gcc" -DCMAKE_CXX_COMPILER="$TRIPLE-g++" \
          -DCMAKE_C_FLAGS="$FLAGS" -DCMAKE_CXX_FLAGS="$FLAGS" \
          -DMATH_LIBRARY="/usr/$TRIPLE/lib/libm.so" \
          "-DCMAKE_CROSSCOMPILING_EMULATOR=qemu-arm;-L;/usr/$TRIPLE" \
          -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DPFFFT_BUILD_EXAMPLES=OFF \
          -DPFFFT_TERMINAL_RADIX8=OFF -DPFFFT_INPLACE_FIRST_PASS=OFF
        cmake --build build_passes_off --parallel
        ctest --test-dir build_passes_off --output-on-failure -j 4

  cross_build_win_from_linux:
    runs-on: ubuntu-latest

    steps:
    - name: prerequisites
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get -qq update
        sudo apt-get -yqq install gcc-mingw-w64 g++-mingw-w64 wine64 wine32:i386
        WINEDEBUG=-all wineboot --init

    - name: check out MIPP
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          repository: hayguen/MIPP
          path: ./MIPP
          persist-credentials: false
    - name: Install MIPP headers
      run: cmake -E copy_directory MIPP/src ../include/mipp

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: build_w32_no-simd
      working-directory: ${{ github.workspace }}/..
      run: cd "$GITHUB_WORKSPACE" && bash ./cross_build_mingw32.sh no-simd -DCMAKE_CROSSCOMPILING_EMULATOR=wine -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_SIMD=OFF -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF
    - name: build_w32_simd_full
      working-directory: ${{ github.workspace }}/..
      run: X="$(pwd)" && cd "$GITHUB_WORKSPACE" && bash ./cross_build_mingw32.sh simd_full -DCMAKE_CROSSCOMPILING_EMULATOR=wine -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DTARGET_CXX_ARCH=pentium4 -DTARGET_C_ARCH=pentium4 -DMIPP_INCLUDE_DIRS="$X"/include/mipp

    - name: build_w64_no-simd
      working-directory: ${{ github.workspace }}/..
      run: cd "$GITHUB_WORKSPACE" && bash ./cross_build_mingw64.sh no-simd -DCMAKE_CROSSCOMPILING_EMULATOR=wine -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_SIMD=OFF -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF
    - name: build_w64_simd_full
      working-directory: ${{ github.workspace }}/..
      run: X="$(pwd)" && cd "$GITHUB_WORKSPACE" && bash ./cross_build_mingw64.sh simd_full -DCMAKE_CROSSCOMPILING_EMULATOR=wine -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DTARGET_CXX_ARCH=none -DTARGET_C_ARCH=none -DPFFFT_TEST_REQUIRE_WIDE=ON -DMIPP_INCLUDE_DIRS="$X"/include/mipp

    - name: test_w32_w64 (wine)
      run: |
        # run the cross-built tests under wine, with the MinGW runtime DLLs on its path
        export WINEDEBUG=-all
        for wn in w32:i686 w64:x86_64; do
          cross="${wn#*:}-w64-mingw32"
          dlls=""
          for dir in "$(dirname "$($cross-g++ -print-file-name=libstdc++-6.dll)")" \
                     "$(dirname "$($cross-g++ -print-file-name=libwinpthread-1.dll)")" \
                     "/usr/$cross/lib" "/usr/$cross/bin"; do
            dlls="$dlls;$(winepath -w "$dir")"
          done
          export WINEPATH="${dlls#;}"
          for build in "build_${wn%%:*}_no-simd" "build_${wn%%:*}_simd_full"; do
            ctest --test-dir "$build" --output-on-failure -j 4
          done
        done

  build_win_msvc:
    # The CMake configure and build commands are platform agnostic and should work equally
    # well on Windows or Mac.  You can convert this to a matrix build if you need
    # cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: windows-latest

    steps:
    - name: check out MIPP
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          repository: hayguen/MIPP
          path: ./MIPP
          persist-credentials: false
    - name: Install MIPP headers
      run: cmake -E copy_directory MIPP/src ../include/mipp

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
      id: msys2
      with:
        msystem: UCRT64
        install: mingw-w64-ucrt-x86_64-binutils
    - name: GNU objdump on PATH (ISA audit)
      shell: bash
      run: echo "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin" >> "$GITHUB_PATH"

    - name: Configure CMake No-SIMD
      shell: bash
      working-directory: ${{ github.workspace }}/..
      run: cmake -S "$GITHUB_WORKSPACE" -B build_no-simd -A x64 -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DPFFFT_USE_SIMD=OFF -DTARGET_CXX_ARCH=none -DTARGET_C_ARCH=none
    - name: Build No-SIMD
      shell: bash
      working-directory: ${{ github.workspace }}/..
      # Execute the build.  You can specify a specific target with "--target <NAME>"
      run: cmake --build build_no-simd --config "$BUILD_TYPE"
    - name: Test no-simd
      shell: bash
      working-directory: ${{ github.workspace }}/..
      run: ctest --test-dir build_no-simd -C "$BUILD_TYPE" --output-on-failure -j 4

    - name: Configure CMake SSE2
      shell: bash
      working-directory: ${{ github.workspace }}/..
      run: cmake -S "$GITHUB_WORKSPACE" -B build_sse2 -A x64 -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DTARGET_CXX_ARCH=SSE2 -DTARGET_C_ARCH=SSE2 -DPFFFT_TEST_REQUIRE_WIDE=ON -DMIPP_INCLUDE_DIRS="$(pwd)"/include/mipp
    - name: Build SSE2
      shell: bash
      working-directory: ${{ github.workspace }}/..
      # Execute the build.  You can specify a specific target with "--target <NAME>"
      run: cmake --build build_sse2 --config "$BUILD_TYPE"
    - name: Test sse2
      shell: bash
      working-directory: ${{ github.workspace }}/..
      run: ctest --test-dir build_sse2 -C "$BUILD_TYPE" --output-on-failure -j 4

    - name: Configure CMake AVX
      # Use a bash shell so we can use the same syntax for environment variable
      # access regardless of the host operating system
      shell: bash
      working-directory: ${{ github.workspace }}/..
      run: cmake -S "$GITHUB_WORKSPACE" -B build_avx -A x64 -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DTARGET_CXX_ARCH=AVX -DTARGET_C_ARCH=AVX -DPFFFT_TEST_REQUIRE_WIDE=ON -DMIPP_INCLUDE_DIRS="$(pwd)"/include/mipp
    - name: Build AVX
      working-directory: ${{ github.workspace }}/..
      shell: bash
      # Execute the build.  You can specify a specific target with "--target <NAME>"
      run: cmake --build build_avx --config "$BUILD_TYPE"
    - name: Test avx
      shell: bash
      working-directory: ${{ github.workspace }}/..
      run: ctest --test-dir build_avx -C "$BUILD_TYPE" --output-on-failure -j 4

    - name: Configure CMake AVX2
      # Use a bash shell so we can use the same syntax for environment variable
      # access regardless of the host operating system
      shell: bash
      working-directory: ${{ github.workspace }}/..
      run: cmake -S "$GITHUB_WORKSPACE" -B build_avx2 -A x64 -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DTARGET_CXX_ARCH=AVX2 -DTARGET_C_ARCH=AVX2 -DPFFFT_TEST_REQUIRE_WIDE=ON -DMIPP_INCLUDE_DIRS="$(pwd)"/include/mipp
    - name: Build AVX2
      working-directory: ${{ github.workspace }}/..
      shell: bash
      # Execute the build.  You can specify a specific target with "--target <NAME>"
      run: cmake --build build_avx2 --config "$BUILD_TYPE"
    - name: Test avx2
      shell: bash
      working-directory: ${{ github.workspace }}/..
      run: ctest --test-dir build_avx2 -C "$BUILD_TYPE" --output-on-failure -j 4

    # Without TARGET_*_ARCH a top-level build probes the runner's
    # CPU for its /arch level, since MSVC has no /arch:native
    - name: Configure CMake host default
      shell: bash
      working-directory: ${{ github.workspace }}/..
      run: |
        cmake -S "$GITHUB_WORKSPACE" -B build_host -A x64 -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DPFFFT_BUILD_BENCHMARKS=OFF -DPFFFT_BUILD_EXAMPLES=OFF -DPFFFT_TEST_REQUIRE_WIDE=ON | tee configure_host.log
        grep -E "TARGET_C_ARCH defaults to 'AVX(2|512)?'" configure_host.log
        grep -E "TARGET_CXX_ARCH defaults to 'AVX(2|512)?'" configure_host.log
    - name: Build host default
      shell: bash
      working-directory: ${{ github.workspace }}/..
      run: cmake --build build_host --config "$BUILD_TYPE"
    - name: Test host default
      shell: bash
      working-directory: ${{ github.workspace }}/..
      run: ctest --test-dir build_host -C "$BUILD_TYPE" --output-on-failure -j 4


  build_win_msvc_wide:
    # the 8-lane backend on Windows: MSVC (separate /arch:AVX2 translation
    # unit) in Debug, LTCG and DLL builds, a DLL without the backend, and
    # clang-cl, also with ThinLTO. Each baseline build runs the ISA audit.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: msvc-release
            cc: cl
            args: -DCMAKE_BUILD_TYPE=Release
          - name: msvc-debug
            cc: cl
            args: -DCMAKE_BUILD_TYPE=Debug
          - name: msvc-ltcg
            # the configuration's own property (INTERPROCEDURAL_OPTIMIZATION_RELEASE)
            cc: cl
            args: -DCMAKE_BUILD_TYPE=Release -DCMAKE_INTERPROCEDURAL_OPTIMIZATION_RELEASE=ON
          - name: msvc-vs-debug
            # multi-configuration generator: the configuration is chosen at build time
            cc: cl
            config: Debug
          - name: msvc-dll
            cc: cl
            args: -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON
          - name: msvc-dll-nowide
            # no 8-lane backend: the DLL's map and audit without it
            cc: cl
            args: -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DPFFFT_ENABLE_WIDE_DISPATCH=OFF -DPFFFT_TEST_REQUIRE_WIDE=OFF
          - name: clangcl-release
            cc: clang-cl
            args: -DCMAKE_BUILD_TYPE=Release
          - name: clangcl-lto
            # ThinLTO: the objects hold bitcode, only the linked image has code
            cc: clang-cl
            # (lld-link and llvm-lib: the configure step passes their full paths)
            args: -DCMAKE_BUILD_TYPE=Release -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON
            llvm_tools: true
    name: build_win_msvc_wide (${{ matrix.name }})
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: compnerd/gha-setup-vsdevenv@452f99effa381b81c025ccfbdccaca509bff1b29 # v7
      with:
        arch: x64
    - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
      id: msys2
      with:
        msystem: UCRT64
        install: mingw-w64-ucrt-x86_64-binutils
    - name: GNU objdump on PATH (ISA audit)
      shell: bash
      run: echo "${{ steps.msys2.outputs.msys2-location }}\\ucrt64\\bin" >> "$GITHUB_PATH"
    - name: Use the Clang toolchain bundled with Visual Studio
      if: matrix.cc == 'clang-cl'
      shell: pwsh
      run: $env:llvmX64 >> $env:GITHUB_PATH
    - name: configure
      shell: bash
      run: |
        if [ -n "${{ matrix.config }}" ]; then
          gen=(-A x64)  # use the runner's default Visual Studio generator
        else
          gen=(-G Ninja -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cc }})
        fi
        if [ "${{ matrix.llvm_tools }}" = true ]; then
          # LTO bitcode needs LLVM's linker and librarian; CMake takes full paths
          gen+=(-DCMAKE_LINKER="$(cygpath -m "$(command -v lld-link)")" -DCMAKE_AR="$(cygpath -m "$(command -v llvm-lib)")")
        fi
        cmake -S . -B build "${gen[@]}" \
          -DTARGET_C_ARCH=none -DTARGET_CXX_ARCH=none -DPFFFT_TEST_REQUIRE_WIDE=ON \
          -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF ${{ matrix.args }}
    - name: build
      shell: bash
      run: cmake --build build --parallel --config "${{ matrix.config || 'Release' }}"
    - name: test
      shell: bash
      run: ctest --test-dir build -C "${{ matrix.config || 'Release' }}" --output-on-failure -j 4

  build_win_msvc_arm64:
    # MSVC on Windows ARM64: NEON float and double; the default generator is
    # whichever Visual Studio the image ships
    runs-on: windows-11-arm

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Configure CMake
      shell: bash
      run: cmake -S . -B build_arm64 -A ARM64 -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF
    - name: Build
      shell: bash
      run: cmake --build build_arm64 --config "$BUILD_TYPE"
    - name: Test
      shell: bash
      run: ctest --test-dir build_arm64 -C "$BUILD_TYPE" --output-on-failure -j 4
    - name: pass schedule switches off (the previous passes)
      # the pass schedule switches default to on; the other position
      shell: bash
      run: |
        cmake -S . -B build_arm64_passes_off -A ARM64 -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DPFFFT_TERMINAL_RADIX8=OFF -DPFFFT_INPLACE_FIRST_PASS=OFF
        cmake --build build_arm64_passes_off --config "$BUILD_TYPE"
        ctest --test-dir build_arm64_passes_off -C "$BUILD_TYPE" --output-on-failure -j 4


  cross_build_win_msvc_arm64:
    # Visual Studio -A ARM64 / -A ARM64EC on an x64 host: CMAKE_SYSTEM_PROCESSOR
    # is the host's "AMD64" there, so pffft must take the target from the
    # compiler (CMAKE_C_COMPILER_ARCHITECTURE_ID). Build only: neither runs
    # on x64. The build includes pf_mixer.cpp, whose SSE path must not be
    # picked for ARM64EC (MSVC defines _M_X64 there too).
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Configure and build ARM64 and ARM64EC
      shell: bash
      run: |
        for arch in ARM64 ARM64EC; do
          lower=$(echo "$arch" | tr '[:upper:]' '[:lower:]')
          cmake -S . -B "build_$lower" -A "$arch" -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF | tee "configure_$lower.log"
          # recognised as the compiler's target, not as the x86 host
          grep -q "no MSVC host tuning for $lower" "configure_$lower.log"
          if grep -q "has no FMA" "configure_$lower.log"; then echo "$arch treated as x86 (FMA reminder)"; exit 1; fi
          if [ -e "build_$lower/benchmarks/pf_conv_arch_sse2.vcxproj" ]; then echo "$arch got the x86 bench_pf_conv_float variants"; exit 1; fi
          cmake --build "build_$lower" --config "$BUILD_TYPE"
          # SIMD backend, from the VARCH strings that pffft_simd_arch() and
          # pffftd_simd_arch() return: NEON for ARM64; scalar for ARM64EC,
          # which defines neither _M_ARM64 nor __ARM_NEON while the SSE
          # headers exclude it
          if [ "$arch" = ARM64 ]; then want=NEON; else want=4xScalar; fi
          lib=$(find "build_$lower" -name pffft.lib | head -1)
          if [ -z "$lib" ]; then echo "$arch: pffft.lib not found"; exit 1; fi
          # each name ends a NUL-terminated string, but other bytes may come
          # right before it, so match it at the end of a line, not the whole
          backends=$(tr '\0' '\n' < "$lib" | grep -aoE '(SSE1|SSE2|AVX|NEON|4xScalar|Scalar)$' | sort -u | tr '\n' ' ')
          echo "$arch backends in $lib: $backends"
          if [ "$backends" != "$want " ]; then
            echo "$arch: expected $want for float and double"; exit 1
          fi
        done


  build_win_mingw:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
      with:
        msystem: UCRT64
        pacboy: gcc:p cmake:p ninja:p python:p
    - name: Configure cmake
      run: cmake -G Ninja -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DTARGET_CXX_ARCH=none -DTARGET_C_ARCH=none -DPFFFT_TEST_REQUIRE_WIDE=ON -S . -B build_mgw64
    - name: Build
      run: cmake --build build_mgw64
    - name: Test
      run: ctest --test-dir build_mgw64 --output-on-failure -j 4
    - name: Debug build
      # -O0: GCC leaves the 8-lane code out on Windows (it cannot align
      # 32-byte stack slots there), the 4-lane code must build and pass
      run: |
        cmake -G Ninja -DCMAKE_BUILD_TYPE=Debug -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DTARGET_CXX_ARCH=none -DTARGET_C_ARCH=none -DPFFFT_BUILD_BENCHMARKS=OFF -S . -B build_mgw64_dbg
        cmake --build build_mgw64_dbg
        ctest --test-dir build_mgw64_dbg --output-on-failure -j 4


  build_macos:
    # copied from build_ubuntu-amd64 with minor renaming
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: cmake_make_simd_float_double
      run: mkdir build_simd_full && cmake -S . -B build_simd_full -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DTARGET_CXX_ARCH=none -DTARGET_C_ARCH=none  && cmake --build build_simd_full && ctest --test-dir build_simd_full --output-on-failure -j 4
    - name: cmake_make_simd_float
      run: mkdir build_simd_float && cmake -S . -B build_simd_float -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_TYPE_DOUBLE=OFF -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DTARGET_CXX_ARCH=none -DTARGET_C_ARCH=none  && cmake --build build_simd_float && ctest --test-dir build_simd_float --output-on-failure -j 4
    - name: cmake_make_simd_double
      run: mkdir build_simd_double && cmake -S . -B build_simd_double -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_TYPE_FLOAT=OFF -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DTARGET_CXX_ARCH=none -DTARGET_C_ARCH=none  && cmake --build build_simd_double && ctest --test-dir build_simd_double --output-on-failure -j 4
    - name: cmake_make_no-simd_float_double
      run: mkdir build_no-simd_full && cmake -S . -B build_no-simd_full -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_SIMD=OFF -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DTARGET_CXX_ARCH=none -DTARGET_C_ARCH=none  && cmake --build build_no-simd_full && ctest --test-dir build_no-simd_full --output-on-failure -j 4
    - name: pass schedule switches off (the previous passes)
      # the pass schedule switches default to on; the other position
      run: mkdir build_simd_passes_off && cmake -S . -B build_simd_passes_off -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DTARGET_CXX_ARCH=none -DTARGET_C_ARCH=none -DPFFFT_TERMINAL_RADIX8=OFF -DPFFFT_INPLACE_FIRST_PASS=OFF && cmake --build build_simd_passes_off && ctest --test-dir build_simd_passes_off --output-on-failure -j 4

  build_w_mipp_macos:
