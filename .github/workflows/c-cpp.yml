  build_win_mingw:
    runs-on: windows-2022
    strategy:
      matrix:
        compiler: [gcc]
        msystem: [MINGW64]
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
      with:
        msystem: MINGW64
        install: gcc cmake make
    - name: Configure cmake
      run: CC=gcc cmake -DMINGW=ON -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DTARGET_CXX_ARCH=none -DTARGET_C_ARCH=none -DPFFFT_TEST_REQUIRE_WIDE=ON -S . -B build_mgw64
    - name: Build
      run: cmake --build build_mgw64
    - name: Test
      run: ctest --test-dir build_mgw64 --output-on-failure -j 4
    - name: Debug build
      # -O0: GCC leaves the 8-lane code out on Windows (it cannot align
      # 32-byte stack slots there), the 4-lane code must build and pass
      run: |
        CC=gcc cmake -DMINGW=ON -DCMAKE_BUILD_TYPE=Debug -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DTARGET_CXX_ARCH=none -DTARGET_C_ARCH=none -DPFFFT_BUILD_BENCHMARKS=OFF -S . -B build_mgw64_dbg
        cmake --build build_mgw64_dbg
        ctest --test-dir build_mgw64_dbg --output-on-failure -j 4

    - name: compress
      run: tar zcvf pffft_windows-mingw-amd64.tar.gz --exclude=CMakeFiles --exclude=*.cmake --exclude=Makefile --exclude=CMakeCache.txt  build_mgw64
    - name: 'Upload Artifact'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: pffft_windows_mingw-amd64
        path: pffft_windows-mingw-amd64.tar.gz


