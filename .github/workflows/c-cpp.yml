name: C/C++ CI

on:
  push:
    branches:
      - master
      - github_actions
  pull_request:
    branches:
      - master
      - github_actions

permissions:
  contents: read

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build_release_profiles:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        preset: [release, release-native, release-native-unfused, release-haswell]
    env:
      CC: ${{ matrix.compiler }}
      CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
      PRESET: ${{ matrix.preset }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Configure
      run: cmake --preset "$PRESET" -DPFFFT_BUILD_BENCHMARKS=OFF -DPFFFT_BUILD_EXAMPLES=OFF
    - name: Build
      run: cmake --build --preset "$PRESET" --parallel 2
    - name: Test
      run: ctest --preset "$PRESET" -j 2

  build_emscripten:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
    - name: cmake configure
      run: emcmake cmake -S . -B build_wasm -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DCMAKE_CROSSCOMPILING_EMULATOR=node -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DPFFFT_BUILD_TESTS=ON -DPFFFT_BUILD_BENCHMARKS=OFF -DPFFFT_BUILD_EXAMPLES=OFF
    - name: build
      run: cmake --build build_wasm
    - name: test
      run: cd build_wasm && ctest --output-on-failure

  build_w_mipp_ubuntu-amd64:
    runs-on: ubuntu-latest

    steps:
    - name: check out MIPP
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          repository: hayguen/MIPP
          path: ./MIPP
          persist-credentials: false
    - name: cmake configure MIPP
      run: cmake -S MIPP -B MIPP_build -DCMAKE_INSTALL_PREFIX="$HOME/.local" -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    - name: cmake install MIPP headers
      run: cmake --build MIPP_build --target install && ls -alh "$HOME/.local/" && ls -alh "$HOME/.local/include/"

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: cmake_make_simd_float_double
      run: mkdir build_simd_full && cmake -S . -B build_simd_full -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DTARGET_CXX_ARCH=none -DTARGET_C_ARCH=none  && cmake --build build_simd_full && ctest --test-dir build_simd_full --output-on-failure -j 4
    - name: cmake_make_simd_float
      run: mkdir build_simd_float && cmake -S . -B build_simd_float -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_TYPE_DOUBLE=OFF -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DTARGET_CXX_ARCH=none -DTARGET_C_ARCH=none  && cmake --build build_simd_float && ctest --test-dir build_simd_float --output-on-failure -j 4
    - name: cmake_make_simd_double
      run: mkdir build_simd_double && cmake -S . -B build_simd_double -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_TYPE_FLOAT=OFF -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DTARGET_CXX_ARCH=none -DTARGET_C_ARCH=none  && cmake --build build_simd_double && ctest --test-dir build_simd_double --output-on-failure -j 4
    - name: cmake_make_no-simd_float_double
      run: mkdir build_no-simd_full && cmake -S . -B build_no-simd_full -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_SIMD=OFF -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DTARGET_CXX_ARCH=none -DTARGET_C_ARCH=none  && cmake --build build_no-simd_full && ctest --test-dir build_no-simd_full --output-on-failure -j 4
    - name: cmake_make_no-simd_scalar_float_double
      run: mkdir build_no-simd_scalar_full && cmake -S . -B build_no-simd_scalar_full -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_SIMD=OFF -DPFFFT_USE_SCALAR_VECT=ON -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DTARGET_CXX_ARCH=none -DTARGET_C_ARCH=none && cmake --build build_no-simd_scalar_full && ctest --test-dir build_no-simd_scalar_full --output-on-failure -j 4
    - name: cmake_make_no-simd_novect_float_double
      run: mkdir build_no-simd_novect && cmake -S . -B build_no-simd_novect -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_SIMD=OFF -DPFFFT_USE_SCALAR_VECT=OFF -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DTARGET_CXX_ARCH=none -DTARGET_C_ARCH=none && cmake --build build_no-simd_novect
    - name: ctest_no-simd_novect
      # greenffts octave wrappers cannot run outside their environment;
      # everything else -- including the SIMD_SZ==1 nosimd kernels --
      # must pass. (The harness step-0 loop that used to hang this test
      # under SZ=1 was fixed in tests/test_fft_factors.c.)
      run: cd build_no-simd_novect && ctest -E "convTest|conv2dTest|rfft2d" --output-on-failure
    - name: compress
      run: tar zcvf pffft_w_mipp_ubuntu-amd64.tar.gz --exclude=CMakeFiles --exclude=*.cmake --exclude=Makefile --exclude=CMakeCache.txt build_simd_full build_simd_float build_simd_double build_no-simd_full build_no-simd_scalar_full
    - name: 'Upload Artifact'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: pffft_w_mipp_ubuntu_builds
        path: pffft_w_mipp_ubuntu-amd64.tar.gz

  build_ubuntu-amd64:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: cmake_make_simd_float_double
      run: mkdir build_simd_full && cmake -S . -B build_simd_full -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DTARGET_CXX_ARCH=none -DTARGET_C_ARCH=none  && cmake --build build_simd_full && ctest --test-dir build_simd_full --output-on-failure -j 4
    - name: cmake_make_simd_float
      run: mkdir build_simd_float && cmake -S . -B build_simd_float -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_TYPE_DOUBLE=OFF -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DTARGET_CXX_ARCH=none -DTARGET_C_ARCH=none  && cmake --build build_simd_float && ctest --test-dir build_simd_float --output-on-failure -j 4
    - name: cmake_make_simd_double
      run: mkdir build_simd_double && cmake -S . -B build_simd_double -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_TYPE_FLOAT=OFF -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DTARGET_CXX_ARCH=none -DTARGET_C_ARCH=none  && cmake --build build_simd_double && ctest --test-dir build_simd_double --output-on-failure -j 4
    - name: cmake_make_no-simd_float_double
      run: mkdir build_no-simd_full && cmake -S . -B build_no-simd_full -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_SIMD=OFF -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DTARGET_CXX_ARCH=none -DTARGET_C_ARCH=none  && cmake --build build_no-simd_full && ctest --test-dir build_no-simd_full --output-on-failure -j 4
    - name: cmake_make_no-simd_scalar_float_double
      run: mkdir build_no-simd_scalar_full && cmake -S . -B build_no-simd_scalar_full -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_SIMD=OFF -DPFFFT_USE_SCALAR_VECT=ON -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DTARGET_CXX_ARCH=none -DTARGET_C_ARCH=none && cmake --build build_no-simd_scalar_full && ctest --test-dir build_no-simd_scalar_full --output-on-failure -j 4
    - name: cmake_make_no-simd_novect_float_double
      run: mkdir build_no-simd_novect && cmake -S . -B build_no-simd_novect -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_SIMD=OFF -DPFFFT_USE_SCALAR_VECT=OFF -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DTARGET_CXX_ARCH=none -DTARGET_C_ARCH=none && cmake --build build_no-simd_novect
    - name: ctest_no-simd_novect
      # greenffts octave wrappers cannot run outside their environment;
      # everything else -- including the SIMD_SZ==1 nosimd kernels --
      # must pass. (The harness step-0 loop that used to hang this test
      # under SZ=1 was fixed in tests/test_fft_factors.c.)
      run: cd build_no-simd_novect && ctest -E "convTest|conv2dTest|rfft2d" --output-on-failure
    - name: compress
      run: tar zcvf pffft_ubuntu-amd64.tar.gz --exclude=CMakeFiles --exclude=*.cmake --exclude=Makefile --exclude=CMakeCache.txt build_simd_full build_simd_float build_simd_double build_no-simd_full build_no-simd_scalar_full
    - name: 'Upload Artifact'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: pffft_ubuntu-amd64
        path: pffft_ubuntu-amd64.tar.gz

  x86_cpu_fallback:
    # A baseline x86-64 build must never run the 8-lane AVX2 backend on CPUs
    # without AVX2/FMA, and must use it on CPUs with them: run the float
    # tests under QEMU emulating Nehalem, SandyBridge and Haswell.
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: install_qemu
      run: sudo apt-get update && sudo apt-get install -y qemu-user binutils python3
    - name: emulated_cpu_tests
      run: tests/run_emulated_cpu_tests.sh build_emulated

  build_ubuntu-arm64:
    # native AArch64 with gcc: NEON float and double, and the sse2neon mixer
    runs-on: ubuntu-24.04-arm

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: cmake_make_simd_float_double
      run: cmake -S . -B build_simd_full -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF && cmake --build build_simd_full --parallel && ctest --test-dir build_simd_full --output-on-failure -j 4
    - name: cmake_make_simd_debug
      # asserts enabled: buffer alignment checks and the SIMD macro validation
      run: cmake -S . -B build_simd_debug -DCMAKE_BUILD_TYPE=Debug -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF && cmake --build build_simd_debug --parallel && ctest --test-dir build_simd_debug --output-on-failure -j 4
    - name: cmake_make_no-simd_float_double
      run: cmake -S . -B build_no-simd_full -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_SIMD=OFF -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF && cmake --build build_no-simd_full --parallel && ctest --test-dir build_no-simd_full --output-on-failure -j 4

  build_linux_cross_qemu:
    # SIMD backends no hosted runner provides, run under qemu-user
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: armv7-neon
            triple: arm-linux-gnueabihf
            processor: armv7l
            qemu: qemu-arm
            flags: -march=armv7-a -mfpu=neon-vfpv4 -mfloat-abi=hard
          - name: ppc64le-altivec-vsx
            triple: powerpc64le-linux-gnu
            processor: ppc64le
            qemu: qemu-ppc64le
            flags: ""
    name: build_linux_cross_qemu (${{ matrix.name }})

    steps:
    - name: prerequisites
      env:
        TRIPLE: ${{ matrix.triple }}
      run: |
        sudo apt-get -qq update
        sudo apt-get -yqq install qemu-user "g++-$TRIPLE"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: configure
      env:
        TRIPLE: ${{ matrix.triple }}
        PROCESSOR: ${{ matrix.processor }}
        QEMU: ${{ matrix.qemu }}
        FLAGS: ${{ matrix.flags }}
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
          -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR="$PROCESSOR" \
          -DCMAKE_C_COMPILER="$TRIPLE-gcc" -DCMAKE_CXX_COMPILER="$TRIPLE-g++" \
          -DCMAKE_C_FLAGS="$FLAGS" -DCMAKE_CXX_FLAGS="$FLAGS" \
          -DMATH_LIBRARY="/usr/$TRIPLE/lib/libm.so" \
          "-DCMAKE_CROSSCOMPILING_EMULATOR=$QEMU;-L;/usr/$TRIPLE" \
          -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DPFFFT_BUILD_EXAMPLES=OFF
    - name: build
      run: cmake --build build --parallel
    - name: test
      run: ctest --test-dir build --output-on-failure -j 4

  cross_build_win_from_linux:
    runs-on: ubuntu-24.04

    steps:
    - name: prerequisites
      run: |
        sudo dpkg --add-architecture i386
        sudo apt -qq update
        sudo apt -yqq install gcc-mingw-w64 g++-mingw-w64 wine64 wine32:i386
        WINEDEBUG=-all wineboot --init

    - name: check out MIPP
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          repository: hayguen/MIPP
          path: ./MIPP
          persist-credentials: false
    - name: cmake configure MIPP
      working-directory: ${{ github.workspace }}/..
      run: cmake -S pffft/MIPP -B MIPP_build -DCMAKE_INSTALL_PREFIX="$(pwd)" -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    - name: cmake install MIPP headers
      working-directory: ${{ github.workspace }}/..
      run: cmake --build MIPP_build --target install

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: build_w32_no-simd
      working-directory: ${{ github.workspace }}/..
      run: cd "$GITHUB_WORKSPACE" && bash ./cross_build_mingw32.sh no-simd -DCMAKE_CROSSCOMPILING_EMULATOR=wine -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_SIMD=OFF -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF
    - name: build_w32_simd_full
      working-directory: ${{ github.workspace }}/..
      run: X="$(pwd)" && cd "$GITHUB_WORKSPACE" && bash ./cross_build_mingw32.sh simd_full -DCMAKE_CROSSCOMPILING_EMULATOR=wine -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DTARGET_CXX_ARCH=pentium4 -DTARGET_C_ARCH=pentium4 -DMIPP_INCLUDE_DIRS="$X"/include/mipp

    - name: build_w64_no-simd
      working-directory: ${{ github.workspace }}/..
      run: cd "$GITHUB_WORKSPACE" && bash ./cross_build_mingw64.sh no-simd -DCMAKE_CROSSCOMPILING_EMULATOR=wine -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_SIMD=OFF -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF
    - name: build_w64_simd_full
      working-directory: ${{ github.workspace }}/..
      run: X="$(pwd)" && cd "$GITHUB_WORKSPACE" && bash ./cross_build_mingw64.sh simd_full -DCMAKE_CROSSCOMPILING_EMULATOR=wine -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DTARGET_CXX_ARCH=none -DTARGET_C_ARCH=none -DPFFFT_TEST_REQUIRE_WIDE=ON -DMIPP_INCLUDE_DIRS="$X"/include/mipp

    - name: test_w32_w64 (wine)
      run: |
        # run the cross-built tests under wine, with the MinGW runtime DLLs on its path
        export WINEDEBUG=-all
        for wn in w32:i686 w64:x86_64; do
          cross="${wn#*:}-w64-mingw32"
          dlls=""
          for dir in "$(dirname "$($cross-g++ -print-file-name=libstdc++-6.dll)")" \
                     "$(dirname "$($cross-g++ -print-file-name=libwinpthread-1.dll)")" \
                     "/usr/$cross/lib" "/usr/$cross/bin"; do
            dlls="$dlls;$(winepath -w "$dir")"
          done
          export WINEPATH="${dlls#;}"
          for build in "build_${wn%%:*}_no-simd" "build_${wn%%:*}_simd_full"; do
            ctest --test-dir "$build" --output-on-failure -j 4
          done
        done
    - name: compress
      run: tar zcvf pffft_cross-build-windows-from-linux-amd64.tar.gz --exclude=CMakeFiles --exclude=*.cmake --exclude=Makefile --exclude=CMakeCache.txt  build_w32_no-simd build_w32_simd_full build_w64_no-simd build_w64_simd_full
    - name: 'Upload Artifact'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: pffft_cross-build-windows-from-linux-amd64
        path: pffft_cross-build-windows-from-linux-amd64.tar.gz


  build_win_msvc:
    # The CMake configure and build commands are platform agnostic and should work equally
    # well on Windows or Mac.  You can convert this to a matrix build if you need
    # cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: windows-2022

    steps:
    - name: check out MIPP
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          repository: hayguen/MIPP
          path: ./MIPP
          persist-credentials: false
    - name: cmake configure MIPP
      shell: bash
      working-directory: ${{ github.workspace }}/..
      run: cmake -S pffft/MIPP -B MIPP_build -DCMAKE_INSTALL_PREFIX="$(pwd)" -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    - name: cmake install MIPP headers
      working-directory: ${{ github.workspace }}/..
      run: cmake --build MIPP_build --target install

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
      id: msys2
      with:
        msystem: MINGW64
        install: mingw-w64-x86_64-binutils
    - name: GNU objdump on PATH (ISA audit)
      shell: bash
      run: echo "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin" >> "$GITHUB_PATH"

    - name: Configure CMake No-SIMD
      shell: bash
      working-directory: ${{ github.workspace }}/..
      run: cmake -S "$GITHUB_WORKSPACE" -B build_no-simd -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DENABLE_PFDSP=ON -DPFFFT_USE_SIMD=OFF -DTARGET_CXX_ARCH=none -DTARGET_C_ARCH=none
    - name: Build No-SIMD
      shell: bash
      working-directory: ${{ github.workspace }}/..
      # Execute the build.  You can specify a specific target with "--target <NAME>"
      run: cmake --build build_no-simd --config "$BUILD_TYPE"
    - name: Test no-simd
      shell: bash
      working-directory: ${{ github.workspace }}/..
      run: ctest --test-dir build_no-simd -C "$BUILD_TYPE" --output-on-failure -j 4

    - name: Configure CMake SSE2
      shell: bash
      working-directory: ${{ github.workspace }}/..
      run: cmake -S "$GITHUB_WORKSPACE" -B build_sse2 -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DENABLE_PFDSP=ON -DTARGET_CXX_ARCH=SSE2 -DTARGET_C_ARCH=SSE2 -DPFFFT_TEST_REQUIRE_WIDE=ON -DMIPP_INCLUDE_DIRS="$(pwd)"/include/mipp
    - name: Build SSE2
      shell: bash
      working-directory: ${{ github.workspace }}/..
      # Execute the build.  You can specify a specific target with "--target <NAME>"
      run: cmake --build build_sse2 --config "$BUILD_TYPE"
    - name: Test sse2
      shell: bash
      working-directory: ${{ github.workspace }}/..
      run: ctest --test-dir build_sse2 -C "$BUILD_TYPE" --output-on-failure -j 4

    - name: Configure CMake AVX
      # Use a bash shell so we can use the same syntax for environment variable
      # access regardless of the host operating system
      shell: bash
      working-directory: ${{ github.workspace }}/..
      run: cmake -S "$GITHUB_WORKSPACE" -B build_avx -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DENABLE_PFDSP=ON -DTARGET_CXX_ARCH=AVX -DTARGET_C_ARCH=AVX -DPFFFT_TEST_REQUIRE_WIDE=ON -DMIPP_INCLUDE_DIRS="$(pwd)"/include/mipp
    - name: Build AVX
      working-directory: ${{ github.workspace }}/..
      shell: bash
      # Execute the build.  You can specify a specific target with "--target <NAME>"
      run: cmake --build build_avx --config "$BUILD_TYPE"
    - name: Test avx
      shell: bash
      working-directory: ${{ github.workspace }}/..
      run: ctest --test-dir build_avx -C "$BUILD_TYPE" --output-on-failure -j 4

    - name: Configure CMake AVX2
      # Use a bash shell so we can use the same syntax for environment variable
      # access regardless of the host operating system
      shell: bash
      working-directory: ${{ github.workspace }}/..
      run: cmake -S "$GITHUB_WORKSPACE" -B build_avx2 -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DENABLE_PFDSP=ON -DTARGET_CXX_ARCH=AVX2 -DTARGET_C_ARCH=AVX2 -DPFFFT_TEST_REQUIRE_WIDE=ON -DMIPP_INCLUDE_DIRS="$(pwd)"/include/mipp
    - name: Build AVX2
      working-directory: ${{ github.workspace }}/..
      shell: bash
      # Execute the build.  You can specify a specific target with "--target <NAME>"
      run: cmake --build build_avx2 --config "$BUILD_TYPE"
    - name: Test avx2
      shell: bash
      working-directory: ${{ github.workspace }}/..
      run: ctest --test-dir build_avx2 -C "$BUILD_TYPE" --output-on-failure -j 4

    # Not archived: without TARGET_*_ARCH a top-level build probes the runner's
    # CPU for its /arch level, since MSVC has no /arch:native
    - name: Configure CMake host default
      shell: bash
      working-directory: ${{ github.workspace }}/..
      run: |
        cmake -S "$GITHUB_WORKSPACE" -B build_host -G "Visual Studio 17 2022" -A x64 -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DPFFFT_BUILD_BENCHMARKS=OFF -DPFFFT_BUILD_EXAMPLES=OFF -DPFFFT_TEST_REQUIRE_WIDE=ON | tee configure_host.log
        grep -E "TARGET_C_ARCH defaults to 'AVX(2|512)?'" configure_host.log
        grep -E "TARGET_CXX_ARCH defaults to 'AVX(2|512)?'" configure_host.log
    - name: Build host default
      shell: bash
      working-directory: ${{ github.workspace }}/..
      run: cmake --build build_host --config "$BUILD_TYPE"
    - name: Test host default
      shell: bash
      working-directory: ${{ github.workspace }}/..
      run: ctest --test-dir build_host -C "$BUILD_TYPE" --output-on-failure -j 4

    - name: compress
      working-directory: ${{ github.workspace }}/..
      run: tar zcvf pffft_windows-msvc-amd64.tar.gz --exclude=CMakeFiles --exclude=*.cmake --exclude=Makefile --exclude=CMakeCache.txt  build_no-simd build_sse2 build_avx build_avx2
    - name: 'Upload Artifact'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: pffft_windows-msvc-amd64
        path: pffft_windows-msvc-amd64.tar.gz


  build_win_msvc_wide:
    # the 8-lane backend on Windows: MSVC (separate /arch:AVX2 translation
    # unit) in Debug, LTCG and DLL builds, a DLL without the backend, and
    # clang-cl, also with ThinLTO; the ISA audit on each; Intel SDE runs of
    # the baseline tests on chips without AVX2 and with other chips' CPUIDs
    # (tests/run_sde_checks.sh)
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: msvc-release
            cc: cl
            args: -DCMAKE_BUILD_TYPE=Release
            sde: true
          - name: msvc-debug
            cc: cl
            args: -DCMAKE_BUILD_TYPE=Debug
          - name: msvc-ltcg
            # the configuration's own property (INTERPROCEDURAL_OPTIMIZATION_RELEASE)
            cc: cl
            args: -DCMAKE_BUILD_TYPE=Release -DCMAKE_INTERPROCEDURAL_OPTIMIZATION_RELEASE=ON
            sde: true
          - name: msvc-vs-debug
            # multi-configuration generator: the configuration is chosen at build time
            cc: cl
            gen: Visual Studio 17 2022
            config: Debug
          - name: msvc-dll
            cc: cl
            args: -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON
            sde: true
          - name: msvc-dll-nowide
            # no 8-lane backend: the DLL's map and audit without it
            cc: cl
            args: -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DPFFFT_ENABLE_WIDE_DISPATCH=OFF -DPFFFT_TEST_REQUIRE_WIDE=OFF
          - name: clangcl-release
            cc: clang-cl
            args: -DCMAKE_BUILD_TYPE=Release
            sde: true
          - name: clangcl-lto
            # ThinLTO: the objects hold bitcode, only the linked image has code
            cc: clang-cl
            # (lld-link and llvm-lib: the configure step passes their full paths)
            args: -DCMAKE_BUILD_TYPE=Release -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON
            llvm_tools: true
            sde: true
    name: build_win_msvc_wide (${{ matrix.name }})
    env:
      SDE_KIT: sde-external-10.13.1-2026-07-28-win.tar.xz
      # Intel's published SHA-256 of the kit (intel.com download 684897); the
      # file is fetched from the setup-sde action's repository at a pinned commit
      SDE_SHA256: 74e626ede09b0baa5011fc9e51b58627ea92c3fc0bae5fd7db34b490f335f651
      SDE_URL: https://media.githubusercontent.com/media/petarpetrovt/setup-sde/6d2773bc0ef3005fd52e0ae0bb91782321793aec/binaries/sde-external-10.13.1-2026-07-28-win.tar.xz
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
      with:
        arch: x64
    - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
      id: msys2
      with:
        msystem: MINGW64
        install: mingw-w64-x86_64-binutils
    - name: GNU objdump on PATH (ISA audit)
      shell: bash
      run: echo "${{ steps.msys2.outputs.msys2-location }}\\mingw64\\bin" >> "$GITHUB_PATH"
    - name: toolchain
      shell: bash
      run: |
        cl -Bv 2>&1 | head -4 || true
        ${{ matrix.cc }} --version 2>&1 | head -1 || true
        objdump --version | head -1
    - name: configure
      shell: bash
      run: |
        if [ -n "${{ matrix.gen }}" ]; then gen=(-G "${{ matrix.gen }}" -A x64); else
          gen=(-G Ninja -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cc }}); fi
        if [ "${{ matrix.llvm_tools }}" = true ]; then
          # LTO bitcode needs LLVM's linker and librarian; CMake takes full paths
          gen+=(-DCMAKE_LINKER="$(cygpath -m "$(command -v lld-link)")" -DCMAKE_AR="$(cygpath -m "$(command -v llvm-lib)")")
        fi
        cmake -S . -B build "${gen[@]}" \
          -DTARGET_C_ARCH=none -DTARGET_CXX_ARCH=none -DPFFFT_TEST_REQUIRE_WIDE=ON \
          -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF ${{ matrix.args }}
    - name: build
      shell: bash
      run: cmake --build build --parallel --config "${{ matrix.config || 'Release' }}"
    - name: test
      shell: bash
      run: ctest --test-dir build -C "${{ matrix.config || 'Release' }}" --output-on-failure -j 4
    - name: objects for diagnosis
      if: failure()
      shell: bash
      # the library's objects, the maps, and the linked test with its object
      run: mkdir -p diag && find build \( -path '*PFFFT.dir*' -name '*.obj' -o -name '*.map' -o -name 'test_pffft_wide*.obj' -o -name 'test_pffft_wide.exe' -o -name 'pffft.dll' \) -exec cp {} diag/ \;
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: failure()
      with:
        name: diag-${{ matrix.name }}
        path: diag
    - name: SDE
      if: ${{ matrix.sde }}
      shell: bash
      run: |
        curl -sfL -o "$SDE_KIT" "$SDE_URL"
        echo "$SDE_SHA256  $SDE_KIT" | sha256sum -c -
        mkdir sde && tar xf "$SDE_KIT" -C sde
        sde=$(find sde -name sde.exe | head -1)
        mkdir neg
        cl -nologo -O2 -arch:AVX2 tests/sde/avx2_unguarded.c -Fe:neg/avx2_unguarded.exe -Fo:neg/
        cl -nologo -O2 -arch:AVX2 -LD -DAVX2_UNGUARDED_LIB tests/sde/avx2_unguarded.c -Fe:neg/avx2_unguarded_dll.dll -Fo:neg/
        cl -nologo -O2 -DAVX2_UNGUARDED_CALLER tests/sde/avx2_unguarded.c neg/avx2_unguarded_dll.lib -Fe:neg/avx2_unguarded_caller.exe -Fo:neg/
        # GNU inline assembly: clang-cl, not cl
        clang-cl -nologo -O2 tests/sde/avx_sse_transition.c -Fe:neg/avx_sse_transition.exe -Fo:neg/
        AST_NEGATIVE=neg/avx_sse_transition.exe bash tests/run_sde_checks.sh "$sde" build neg/avx2_unguarded.exe neg/avx2_unguarded_caller.exe neg/avx2_unguarded_dll.dll


  sde_linux:
    # Linux baseline build under Intel SDE (tests/run_sde_checks.sh)
    runs-on: ubuntu-24.04
    env:
      SDE_KIT: sde-external-10.13.1-2026-07-28-lin.tar.xz
      # Intel's published SHA-256 (intel.com download 684897)
      SDE_SHA256: 94e97d623fec54385686e1e7ba65ebc9941748c05ee451423948334892bf2b50
      SDE_URL: https://media.githubusercontent.com/media/petarpetrovt/setup-sde/6d2773bc0ef3005fd52e0ae0bb91782321793aec/binaries/sde-external-10.13.1-2026-07-28-lin.tar.xz
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: build
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DTARGET_C_ARCH=none -DTARGET_CXX_ARCH=none \
          -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF \
          -DPFFFT_BUILD_BENCHMARKS=OFF -DPFFFT_BUILD_EXAMPLES=OFF
        cmake --build build --parallel 4 --target test_pffft_wide test_pffft_accuracy_float
        gcc -O2 -mavx2 tests/sde/avx2_unguarded.c -o build/avx2_unguarded
        gcc -O2 tests/sde/avx_sse_transition.c -o build/avx_sse_transition
    - name: SDE
      run: |
        curl -sfL -o "$SDE_KIT" "$SDE_URL"
        echo "$SDE_SHA256  $SDE_KIT" | sha256sum -c -
        mkdir sde && tar xf "$SDE_KIT" -C sde
        AST_NEGATIVE=build/avx_sse_transition bash tests/run_sde_checks.sh "$(find "$PWD/sde" -name sde64 | head -1)" build build/avx2_unguarded


  build_win_msvc_arm64:
    # MSVC on Windows ARM64: NEON float and double; the default generator is
    # whichever Visual Studio the image ships
    runs-on: windows-11-arm

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
