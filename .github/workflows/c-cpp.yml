name: C/C++ CI

on:
  push:
    branches:
      - master
      - github_actions
  pull_request:
    branches:
      - master
      - github_actions

permissions:
  contents: read

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build_emscripten:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
    - name: cmake configure
      run: emcmake cmake -S . -B build_wasm -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DCMAKE_CROSSCOMPILING_EMULATOR=node -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DPFFFT_BUILD_TESTS=ON -DPFFFT_BUILD_BENCHMARKS=OFF -DPFFFT_BUILD_EXAMPLES=OFF
    - name: build
      run: cmake --build build_wasm
    - name: test
      run: cd build_wasm && ctest --output-on-failure

  build_w_mipp_ubuntu-amd64:
    runs-on: ubuntu-latest

    steps:
    - name: check out MIPP
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          repository: hayguen/MIPP
          path: ./MIPP
          persist-credentials: false
    - name: cmake configure MIPP
      run: cmake -S MIPP -B MIPP_build -DCMAKE_INSTALL_PREFIX="$HOME/.local" -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    - name: cmake install MIPP headers
      run: cmake --build MIPP_build --target install && ls -alh "$HOME/.local/" && ls -alh "$HOME/.local/include/"

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: cmake_make_simd_float_double
      run: mkdir build_simd_full && cmake -S . -B build_simd_full -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DTARGET_CXX_ARCH=native -DTARGET_C_ARCH=native  && cmake --build build_simd_full && ctest --test-dir build_simd_full --output-on-failure -j 4
    - name: cmake_make_simd_float
      run: mkdir build_simd_float && cmake -S . -B build_simd_float -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_TYPE_DOUBLE=OFF -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DTARGET_CXX_ARCH=native -DTARGET_C_ARCH=native  && cmake --build build_simd_float && ctest --test-dir build_simd_float --output-on-failure -j 4
    - name: cmake_make_simd_double
      run: mkdir build_simd_double && cmake -S . -B build_simd_double -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_TYPE_FLOAT=OFF -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DTARGET_CXX_ARCH=native -DTARGET_C_ARCH=native  && cmake --build build_simd_double && ctest --test-dir build_simd_double --output-on-failure -j 4
    - name: cmake_make_no-simd_float_double
      run: mkdir build_no-simd_full && cmake -S . -B build_no-simd_full -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_SIMD=OFF -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DTARGET_CXX_ARCH=native -DTARGET_C_ARCH=native  && cmake --build build_no-simd_full && ctest --test-dir build_no-simd_full --output-on-failure -j 4
    - name: cmake_make_no-simd_scalar_float_double
      run: mkdir build_no-simd_scalar_full && cmake -S . -B build_no-simd_scalar_full -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_SIMD=OFF -DPFFFT_USE_SCALAR_VECT=ON -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DTARGET_CXX_ARCH=native -DTARGET_C_ARCH=native && cmake --build build_no-simd_scalar_full && ctest --test-dir build_no-simd_scalar_full --output-on-failure -j 4
    - name: cmake_make_no-simd_novect_float_double
      run: mkdir build_no-simd_novect && cmake -S . -B build_no-simd_novect -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_SIMD=OFF -DPFFFT_USE_SCALAR_VECT=OFF -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DTARGET_CXX_ARCH=native -DTARGET_C_ARCH=native && cmake --build build_no-simd_novect
    - name: ctest_no-simd_novect
      # greenffts octave wrappers cannot run outside their environment;
      # everything else -- including the SIMD_SZ==1 nosimd kernels --
      # must pass. (The harness step-0 loop that used to hang this test
      # under SZ=1 was fixed in tests/test_fft_factors.c.)
      run: cd build_no-simd_novect && ctest -E "convTest|conv2dTest|rfft2d" --output-on-failure
    - name: compress
      run: tar zcvf pffft_w_mipp_ubuntu-amd64.tar.gz --exclude=CMakeFiles --exclude=*.cmake --exclude=Makefile --exclude=CMakeCache.txt build_simd_full build_simd_float build_simd_double build_no-simd_full build_no-simd_scalar_full
    - name: 'Upload Artifact'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: pffft_w_mipp_ubuntu_builds
        path: pffft_w_mipp_ubuntu-amd64.tar.gz

  build_ubuntu-amd64:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: cmake_make_simd_float_double
      run: mkdir build_simd_full && cmake -S . -B build_simd_full -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DTARGET_CXX_ARCH=native -DTARGET_C_ARCH=native  && cmake --build build_simd_full && ctest --test-dir build_simd_full --output-on-failure -j 4
    - name: cmake_make_simd_float
      run: mkdir build_simd_float && cmake -S . -B build_simd_float -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_TYPE_DOUBLE=OFF -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DTARGET_CXX_ARCH=native -DTARGET_C_ARCH=native  && cmake --build build_simd_float && ctest --test-dir build_simd_float --output-on-failure -j 4
    - name: cmake_make_simd_double
      run: mkdir build_simd_double && cmake -S . -B build_simd_double -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_TYPE_FLOAT=OFF -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DTARGET_CXX_ARCH=native -DTARGET_C_ARCH=native  && cmake --build build_simd_double && ctest --test-dir build_simd_double --output-on-failure -j 4
    - name: cmake_make_no-simd_float_double
      run: mkdir build_no-simd_full && cmake -S . -B build_no-simd_full -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_SIMD=OFF -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DTARGET_CXX_ARCH=native -DTARGET_C_ARCH=native  && cmake --build build_no-simd_full && ctest --test-dir build_no-simd_full --output-on-failure -j 4
    - name: cmake_make_no-simd_scalar_float_double
      run: mkdir build_no-simd_scalar_full && cmake -S . -B build_no-simd_scalar_full -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_SIMD=OFF -DPFFFT_USE_SCALAR_VECT=ON -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DTARGET_CXX_ARCH=native -DTARGET_C_ARCH=native && cmake --build build_no-simd_scalar_full && ctest --test-dir build_no-simd_scalar_full --output-on-failure -j 4
    - name: cmake_make_no-simd_novect_float_double
      run: mkdir build_no-simd_novect && cmake -S . -B build_no-simd_novect -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_SIMD=OFF -DPFFFT_USE_SCALAR_VECT=OFF -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DTARGET_CXX_ARCH=native -DTARGET_C_ARCH=native && cmake --build build_no-simd_novect
    - name: ctest_no-simd_novect
      # greenffts octave wrappers cannot run outside their environment;
      # everything else -- including the SIMD_SZ==1 nosimd kernels --
      # must pass. (The harness step-0 loop that used to hang this test
      # under SZ=1 was fixed in tests/test_fft_factors.c.)
      run: cd build_no-simd_novect && ctest -E "convTest|conv2dTest|rfft2d" --output-on-failure
    - name: compress
      run: tar zcvf pffft_ubuntu-amd64.tar.gz --exclude=CMakeFiles --exclude=*.cmake --exclude=Makefile --exclude=CMakeCache.txt build_simd_full build_simd_float build_simd_double build_no-simd_full build_no-simd_scalar_full
    - name: 'Upload Artifact'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: pffft_ubuntu-amd64
        path: pffft_ubuntu-amd64.tar.gz

  build_ubuntu-arm64:
    # native AArch64 with gcc: NEON float and double, and the sse2neon mixer
    runs-on: ubuntu-24.04-arm

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: cmake_make_simd_float_double
      run: cmake -S . -B build_simd_full -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF && cmake --build build_simd_full --parallel && ctest --test-dir build_simd_full --output-on-failure -j 4
    - name: cmake_make_simd_debug
      # asserts enabled: buffer alignment checks and the SIMD macro validation
      run: cmake -S . -B build_simd_debug -DCMAKE_BUILD_TYPE=Debug -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF && cmake --build build_simd_debug --parallel && ctest --test-dir build_simd_debug --output-on-failure -j 4
    - name: cmake_make_no-simd_float_double
      run: cmake -S . -B build_no-simd_full -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_SIMD=OFF -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF && cmake --build build_no-simd_full --parallel && ctest --test-dir build_no-simd_full --output-on-failure -j 4

  build_linux_cross_qemu:
    # SIMD backends no hosted runner provides, run under qemu-user
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: armv7-neon
            triple: arm-linux-gnueabihf
            processor: armv7l
            qemu: qemu-arm
            flags: -march=armv7-a -mfpu=neon-vfpv4 -mfloat-abi=hard
          - name: ppc64le-altivec-vsx
            triple: powerpc64le-linux-gnu
            processor: ppc64le
            qemu: qemu-ppc64le
            flags: ""
    name: build_linux_cross_qemu (${{ matrix.name }})

    steps:
    - name: prerequisites
      env:
        TRIPLE: ${{ matrix.triple }}
      run: |
        sudo apt-get -qq update
        sudo apt-get -yqq install qemu-user "g++-$TRIPLE"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: configure
      env:
        TRIPLE: ${{ matrix.triple }}
        PROCESSOR: ${{ matrix.processor }}
        QEMU: ${{ matrix.qemu }}
        FLAGS: ${{ matrix.flags }}
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
          -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR="$PROCESSOR" \
          -DCMAKE_C_COMPILER="$TRIPLE-gcc" -DCMAKE_CXX_COMPILER="$TRIPLE-g++" \
          -DCMAKE_C_FLAGS="$FLAGS" -DCMAKE_CXX_FLAGS="$FLAGS" \
          -DMATH_LIBRARY="/usr/$TRIPLE/lib/libm.so" \
          "-DCMAKE_CROSSCOMPILING_EMULATOR=$QEMU;-L;/usr/$TRIPLE" \
          -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DPFFFT_BUILD_EXAMPLES=OFF
    - name: build
      run: cmake --build build --parallel
    - name: test
      run: ctest --test-dir build --output-on-failure -j 4

  cross_build_win_from_linux:
    runs-on: ubuntu-24.04

    steps:
    - name: prerequisites
      run: |
        sudo dpkg --add-architecture i386
        sudo apt -qq update
        sudo apt -yqq install gcc-mingw-w64 g++-mingw-w64 wine64 wine32:i386
        WINEDEBUG=-all wineboot --init

    - name: check out MIPP
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          repository: hayguen/MIPP
          path: ./MIPP
          persist-credentials: false
    - name: cmake configure MIPP
      working-directory: ${{ github.workspace }}/..
      run: cmake -S pffft/MIPP -B MIPP_build -DCMAKE_INSTALL_PREFIX="$(pwd)" -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    - name: cmake install MIPP headers
      working-directory: ${{ github.workspace }}/..
      run: cmake --build MIPP_build --target install

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: build_w32_no-simd
      working-directory: ${{ github.workspace }}/..
      run: cd "$GITHUB_WORKSPACE" && bash ./cross_build_mingw32.sh no-simd -DCMAKE_CROSSCOMPILING_EMULATOR=wine -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_SIMD=OFF -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF
    - name: build_w32_simd_full
      working-directory: ${{ github.workspace }}/..
      run: X="$(pwd)" && cd "$GITHUB_WORKSPACE" && bash ./cross_build_mingw32.sh simd_full -DCMAKE_CROSSCOMPILING_EMULATOR=wine -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DTARGET_CXX_ARCH=pentium4 -DTARGET_C_ARCH=pentium4 -DMIPP_INCLUDE_DIRS="$X"/include/mipp

    - name: build_w64_no-simd
      working-directory: ${{ github.workspace }}/..
      run: cd "$GITHUB_WORKSPACE" && bash ./cross_build_mingw64.sh no-simd -DCMAKE_CROSSCOMPILING_EMULATOR=wine -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_SIMD=OFF -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF
    - name: build_w64_simd_full
      working-directory: ${{ github.workspace }}/..
      run: X="$(pwd)" && cd "$GITHUB_WORKSPACE" && bash ./cross_build_mingw64.sh simd_full -DCMAKE_CROSSCOMPILING_EMULATOR=wine -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DTARGET_CXX_ARCH=sandybridge -DTARGET_C_ARCH=sandybridge -DMIPP_INCLUDE_DIRS="$X"/include/mipp

    - name: test_w32_w64 (wine)
      run: |
        # run the cross-built tests under wine, with the MinGW runtime DLLs on its path
        export WINEDEBUG=-all
        for wn in w32:i686 w64:x86_64; do
          cross="${wn#*:}-w64-mingw32"
          dlls=""
          for dir in "$(dirname "$($cross-g++ -print-file-name=libstdc++-6.dll)")" \
                     "$(dirname "$($cross-g++ -print-file-name=libwinpthread-1.dll)")" \
                     "/usr/$cross/lib" "/usr/$cross/bin"; do
            dlls="$dlls;$(winepath -w "$dir")"
          done
          export WINEPATH="${dlls#;}"
          for build in "build_${wn%%:*}_no-simd" "build_${wn%%:*}_simd_full"; do
            ctest --test-dir "$build" --output-on-failure -j 4
          done
        done
    - name: compress
      run: tar zcvf pffft_cross-build-windows-from-linux-amd64.tar.gz --exclude=CMakeFiles --exclude=*.cmake --exclude=Makefile --exclude=CMakeCache.txt  build_w32_no-simd build_w32_simd_full build_w64_no-simd build_w64_simd_full
    - name: 'Upload Artifact'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: pffft_cross-build-windows-from-linux-amd64
        path: pffft_cross-build-windows-from-linux-amd64.tar.gz


  build_win_msvc:
    # The CMake configure and build commands are platform agnostic and should work equally
    # well on Windows or Mac.  You can convert this to a matrix build if you need
    # cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: windows-2022

    steps:
    - name: check out MIPP
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          repository: hayguen/MIPP
          path: ./MIPP
          persist-credentials: false
    - name: cmake configure MIPP
      shell: bash
      working-directory: ${{ github.workspace }}/..
      run: cmake -S pffft/MIPP -B MIPP_build -DCMAKE_INSTALL_PREFIX="$(pwd)" -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    - name: cmake install MIPP headers
      working-directory: ${{ github.workspace }}/..
      run: cmake --build MIPP_build --target install

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Configure CMake No-SIMD
      shell: bash
      working-directory: ${{ github.workspace }}/..
      run: cmake -S "$GITHUB_WORKSPACE" -B build_no-simd -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DENABLE_PFDSP=ON -DPFFFT_USE_SIMD=OFF -DTARGET_CXX_ARCH=none -DTARGET_C_ARCH=none
    - name: Build No-SIMD
      shell: bash
      working-directory: ${{ github.workspace }}/..
      # Execute the build.  You can specify a specific target with "--target <NAME>"
      run: cmake --build build_no-simd --config "$BUILD_TYPE"
    - name: Test no-simd
      shell: bash
      working-directory: ${{ github.workspace }}/..
      run: ctest --test-dir build_no-simd -C "$BUILD_TYPE" --output-on-failure -j 4

    - name: Configure CMake SSE2
      shell: bash
      working-directory: ${{ github.workspace }}/..
      run: cmake -S "$GITHUB_WORKSPACE" -B build_sse2 -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DENABLE_PFDSP=ON -DTARGET_CXX_ARCH=SSE2 -DTARGET_C_ARCH=SSE2 -DMIPP_INCLUDE_DIRS="$(pwd)"/include/mipp
    - name: Build SSE2
      shell: bash
      working-directory: ${{ github.workspace }}/..
      # Execute the build.  You can specify a specific target with "--target <NAME>"
      run: cmake --build build_sse2 --config "$BUILD_TYPE"
    - name: Test sse2
      shell: bash
      working-directory: ${{ github.workspace }}/..
      run: ctest --test-dir build_sse2 -C "$BUILD_TYPE" --output-on-failure -j 4

    - name: Configure CMake AVX
      # Use a bash shell so we can use the same syntax for environment variable
      # access regardless of the host operating system
      shell: bash
      working-directory: ${{ github.workspace }}/..
      run: cmake -S "$GITHUB_WORKSPACE" -B build_avx -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DENABLE_PFDSP=ON -DTARGET_CXX_ARCH=AVX -DTARGET_C_ARCH=AVX -DMIPP_INCLUDE_DIRS="$(pwd)"/include/mipp
    - name: Build AVX
      working-directory: ${{ github.workspace }}/..
      shell: bash
      # Execute the build.  You can specify a specific target with "--target <NAME>"
      run: cmake --build build_avx --config "$BUILD_TYPE"
    - name: Test avx
      shell: bash
      working-directory: ${{ github.workspace }}/..
      run: ctest --test-dir build_avx -C "$BUILD_TYPE" --output-on-failure -j 4

    - name: Configure CMake AVX2
      # Use a bash shell so we can use the same syntax for environment variable
      # access regardless of the host operating system
      shell: bash
      working-directory: ${{ github.workspace }}/..
      run: cmake -S "$GITHUB_WORKSPACE" -B build_avx2 -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DENABLE_PFDSP=ON -DTARGET_CXX_ARCH=AVX2 -DTARGET_C_ARCH=AVX2 -DMIPP_INCLUDE_DIRS="$(pwd)"/include/mipp
    - name: Build AVX2
      working-directory: ${{ github.workspace }}/..
      shell: bash
      # Execute the build.  You can specify a specific target with "--target <NAME>"
      run: cmake --build build_avx2 --config "$BUILD_TYPE"
    - name: Test avx2
      shell: bash
      working-directory: ${{ github.workspace }}/..
      run: ctest --test-dir build_avx2 -C "$BUILD_TYPE" --output-on-failure -j 4

    - name: compress
      working-directory: ${{ github.workspace }}/..
      run: tar zcvf pffft_windows-msvc-amd64.tar.gz --exclude=CMakeFiles --exclude=*.cmake --exclude=Makefile --exclude=CMakeCache.txt  build_no-simd build_sse2 build_avx build_avx2
    - name: 'Upload Artifact'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: pffft_windows-msvc-amd64
        path: pffft_windows-msvc-amd64.tar.gz


  build_win_msvc_arm64:
    # MSVC on Windows ARM64: NEON float and double; the default generator is
    # whichever Visual Studio the image ships
    runs-on: windows-11-arm

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Configure CMake
      shell: bash
      run: cmake -S . -B build_arm64 -A ARM64 -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DENABLE_PFDSP=ON
    - name: Build
      shell: bash
      run: cmake --build build_arm64 --config "$BUILD_TYPE"
    - name: Test
      shell: bash
      run: ctest --test-dir build_arm64 -C "$BUILD_TYPE" --output-on-failure -j 4


  build_win_mingw:
    runs-on: windows-2022
    strategy:
      matrix:
        compiler: [gcc]
        msystem: [MINGW64]
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
      with:
        msystem: MINGW64
        install: gcc cmake make
    - name: Configure cmake
      run: CC=gcc cmake -DMINGW=ON -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DTARGET_CXX_ARCH=native -DTARGET_C_ARCH=native -S . -B build_mgw64
    - name: Build
      run: cmake --build build_mgw64
    - name: Test
      run: ctest --test-dir build_mgw64 --output-on-failure -j 4

    - name: compress
      run: tar zcvf pffft_windows-mingw-amd64.tar.gz --exclude=CMakeFiles --exclude=*.cmake --exclude=Makefile --exclude=CMakeCache.txt  build_mgw64
    - name: 'Upload Artifact'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: pffft_windows_mingw-amd64
        path: pffft_windows-mingw-amd64.tar.gz


